name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # A migration that goes wrong is the likeliest way this database gets
      # corrupted, and D1 Time Travel can restore to any bookmark from the
      # last 30 days. Printing the bookmark here gives that restore an exact
      # "before" point instead of a guessed timestamp:
      #   npx wrangler d1 time-travel restore makethe-team --bookmark=<id>
      - name: Record D1 Time Travel bookmark
        run: npx wrangler d1 time-travel info makethe-team
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply makethe-team --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /tmp/body -w "%{http_code}" https://makethe.team/ || echo 000)
            if [ "$status" = "200" ] && grep -q "Make The Team" /tmp/body; then
              echo "Smoke check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: status $status"
            sleep 10
          done
          echo "Smoke check failed"
          exit 1
